<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ page.app_name | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if page.app_path %}<link rel="icon" href="{{ page.app_path | append: 'icon.png' | relative_url }}">{% endif %}
  <style>
    :root {
      --bg: #ffffff; --surface: #f5f5f8; --text: #1d1d1f; --muted: #6e6e73;
      --line: #e3e3e8; --accent: #311db4; --accent-soft: #3fe59e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114; --surface: #1c1c21; --text: #f2f2f5; --muted: #9a9aa2;
        --line: #2c2c33; --accent: #a79bff; --accent-soft: #3fe59e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header, main, footer { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 12px; padding-top: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none;
             font-weight: 650; font-size: 20px; }
    .brand img { border-radius: 9px; }
    nav { display: flex; gap: 4px; }
    nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 15px; }
    nav a:hover { color: var(--text); background: var(--surface); }
    nav a[aria-current="page"] { color: var(--text); background: var(--surface); font-weight: 600; }
    main { padding-top: 12px; padding-bottom: 48px; }
    h1 { font-size: 34px; line-height: 1.2; letter-spacing: -0.02em; margin: 28px 0 8px; }
    h2 { font-size: 23px; letter-spacing: -0.01em; margin: 40px 0 8px; }
    h3 { font-size: 18px; margin: 28px 0 4px; }
    a { color: var(--accent); }
    p, li { color: var(--text); }
    .lead { font-size: 20px; color: var(--muted); margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; }
    th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line);
             overflow-wrap: anywhere; }
    th { color: var(--muted); font-weight: 600; }
    code { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface);
           padding: 2px 6px; border-radius: 5px; overflow-wrap: anywhere; }
    kbd { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; background: var(--surface);
          border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
          padding: 1px 7px; white-space: nowrap; }
    .card { display: flex; gap: 18px; align-items: center; padding: 20px; margin: 24px 0;
            background: var(--surface); border-radius: 16px; color: var(--text); text-decoration: none; }
    .card img { border-radius: 14px; flex: none; }
    .card:hover { outline: 2px solid var(--line); }
    .card .name { display: block; font-size: 20px; font-weight: 650; }
    .card .blurb { display: block; color: var(--muted); }
    footer { color: var(--muted); font-size: 14px; padding-top: 20px; padding-bottom: 40px;
             border-top: 1px solid var(--line); }
    @media (max-width: 520px) {
      h1 { font-size: 28px; } body { font-size: 16px; }
      table { font-size: 14px; } th, td { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <header>
    {% if page.app_name %}
      {% assign base = page.app_path | relative_url %}
      <a class="brand" href="{{ base }}">
        <img src="{{ page.app_path | append: 'icon.png' | relative_url }}" alt="" width="40" height="40">
        {{ page.app_name }}
      </a>
      <nav>
        <a href="{{ base }}" {% if page.url == page.app_path %}aria-current="page"{% endif %}>Overview</a>
        <a href="{{ page.app_path | append: 'support/' | relative_url }}" {% if page.url contains '/support/' %}aria-current="page"{% endif %}>Support</a>
        <a href="{{ page.app_path | append: 'privacy/' | relative_url }}" {% if page.url contains '/privacy/' %}aria-current="page"{% endif %}>Privacy</a>
      </nav>
    {% else %}
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% endif %}
  </header>
  <main>
{{ content }}
  </main>
  <footer>© {{ site.time | date: '%Y' }} {{ site.author }}</footer>
</body>
</html>
